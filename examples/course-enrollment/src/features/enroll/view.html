<section class="enroll">
  <h2>Enroll a student</h2>
  <form method="post" action="/enroll">
    <label>Student
      <select name="student_id">$student_options</select>
    </label>
    <label>Course
      <select name="course_code">$course_options</select>
    </label>
    <button type="submit">Enroll</button>
  </form>
</section>
